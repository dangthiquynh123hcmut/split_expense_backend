
# Biến môi trường cần export trước khi chạy:
#   BACKEND_IMAGE=<dockerhub_user>/split-expense-backend:<tag>

version: '3.8'

services:
  django:
    image: ${BACKEND_IMAGE:-dangthiquynh123hcmut/split-expense-backend:latest}
    container_name: split_expense_backend_prod
    command: >
      sh -c "cd src &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 split_expense_system.asgi:application"
    env_file:
      - ./env/.env.prod
    environment:
      DEBUG: "False"
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./logs:/app/logs
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - split_expense_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: split_expense_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      django:
        condition: service_healthy
    networks:
      - split_expense_network
    restart: unless-stopped

networks:
  split_expense_network:
    driver: bridge

volumes:
  staticfiles:
  media:
