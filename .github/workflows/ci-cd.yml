name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/split-expense-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Required for AWS OIDC authentication
permissions:
  id-token: write   # generate OIDC token for AWS
  contents: read    # checkout code

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI – Lint + Test
  # ─────────────────────────────────────────────
  ci:
    name: CI – Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: split_expense_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: split_expense_system.test_settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          POSTGRES_DB: split_expense_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker image
  # (chỉ chạy khi push vào main)
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to EC2 (Canary → Full)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production (Canary Rolling)
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Lấy EC2 instance IDs từ Auto Scaling Group ──
      - name: Get EC2 instance IDs from ASG
        id: get_instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          echo "Found instances: $INSTANCE_IDS"

          INSTANCE_ARRAY=($INSTANCE_IDS)
          CANARY_INSTANCE=${INSTANCE_ARRAY[0]}
          ALL_INSTANCES=$(echo "$INSTANCE_IDS" | tr '\t' ',')

          echo "canary=$CANARY_INSTANCE" >> $GITHUB_OUTPUT
          echo "all=$ALL_INSTANCES" >> $GITHUB_OUTPUT
          echo "count=${#INSTANCE_ARRAY[@]}" >> $GITHUB_OUTPUT

      # ── Bước 1: Canary deploy – chỉ 1 instance đầu tiên ──
      - name: Canary deploy (1st instance)
        run: |
          CANARY="${{ steps.get_instances.outputs.canary }}"
          IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"

          echo "Canary deploying tag=$IMAGE_TAG to instance=$CANARY"

          CMD='["export HOME=/root && cd /opt/split-expense-backend && git config --global --add safe.directory /opt/split-expense-backend && IMAGE_TAG='"$IMAGE_TAG"' DOCKER_USERNAME='"$DOCKER_USERNAME"' bash scripts/deploy-ec2.sh"]'

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$CANARY" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$CMD" \
            --output-s3-bucket-name "${{ secrets.SSM_LOG_BUCKET }}" \
            --output-s3-key-prefix "ssm-logs/canary" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          # Wait up to 10 min for command to finish
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$CANARY"

          # Check exit status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$CANARY" \
            --query "StatusDetails" \
            --output text)
          echo "Command status: $STATUS"
          [[ "$STATUS" == "Success" ]] || { echo "Deploy failed: $STATUS"; exit 1; }

      # ── Health check qua ALB (GitHub runner không thể reach private IP) ──
      - name: Health check via ALB
        run: |
          # Get ALB DNS from AWS
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "split-expense-alb" \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [[ -z "$ALB_DNS" || "$ALB_DNS" == "None" ]]; then
            echo "WARNING: Could not get ALB DNS, skipping HTTP health check"
            echo "Relying on SSM command success status instead"
            exit 0
          fi

          echo "Checking health at: http://$ALB_DNS/health/"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 http://$ALB_DNS/health/ || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "ALB health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 20s..."
            sleep 20
          done
          echo "Health check failed after 5 minutes!"
          exit 1

      # ── Bước 2: Full rollout – tất cả instance còn lại ──
      - name: Full rollout (all remaining instances)
        if: steps.get_instances.outputs.count > 1
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          ALL_IDS="${{ steps.get_instances.outputs.all }}"

          echo "Full rollout tag=$IMAGE_TAG to instances: $ALL_IDS"

          CMD='["export HOME=/root && cd /opt/split-expense-backend && git config --global --add safe.directory /opt/split-expense-backend && IMAGE_TAG='"$IMAGE_TAG"' DOCKER_USERNAME='"$DOCKER_USERNAME"' bash scripts/deploy-ec2.sh"]'

          # Send to all instances simultaneously
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $(echo "$ALL_IDS" | tr ',' ' ') \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$CMD" \
            --output-s3-bucket-name "${{ secrets.SSM_LOG_BUCKET }}" \
            --output-s3-key-prefix "ssm-logs/full" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          # Wait for each instance
          for INSTANCE_ID in $(echo "$ALL_IDS" | tr ',' ' '); do
            echo "Waiting for $INSTANCE_ID..."
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StatusDetails" \
              --output text)
            echo "  $INSTANCE_ID: $STATUS"
            [[ "$STATUS" == "Success" ]] || { echo "Deploy failed on $INSTANCE_ID: $STATUS"; exit 1; }
          done

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed!"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          echo "Instances: ${{ steps.get_instances.outputs.all }}"
          echo "Commit: ${{ github.sha }}"
