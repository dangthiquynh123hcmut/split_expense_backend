# Upstream Gunicorn Application Server
upstream gunicorn {
    server 127.0.0.1:8000;
}

# HTTP Server - Redirect to HTTPS or Let's Encrypt validation
server {
    listen 80;
    server_name split-expense.app www.split-expense.app;
    client_max_body_size 100M;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name split-expense.app www.split-expense.app;
    client_max_body_size 100M;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/split-expense.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/split-expense.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static files
    location /static/ {
        alias /home/ubuntu/split-expense-backend/src/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/split-expense-backend/src/media/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
