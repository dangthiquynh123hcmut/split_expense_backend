services:
  - type: web
    name: split-expense-backend
    env: python
    buildCommand: "chmod a+x ./build.sh && ./build.sh"
    startCommand: "gunicorn split_expense_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.7"
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project"
      - key: DJANGO_SETTINGS_MODULE
        value: "split_expense_system.settings"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DISABLE_COLLECTSTATIC
        value: 0
      - key: PYTHONUNBUFFERED
        value: "True"
    plan: free
    buildCommandPriority: high
