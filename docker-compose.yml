version: '3.8'

services:
  django:
    build: .
    container_name: split_expense_backend_prod
    command: >
      sh -c "cd src &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn split_expense_system.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile -"
    env_file:
      - ./env/.env.prod
    environment:
      DEBUG: "False"
    expose:
      - "8000"
    volumes:
      - ./src/staticfiles:/app/staticfiles
      - ./src/media:/app/media
      - ./logs:/app/logs
    networks:
      - split_expense_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: split_expense_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./src/staticfiles:/app/staticfiles:ro
      - ./src/media:/app/media:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - django
    networks:
      - split_expense_network
    restart: unless-stopped

networks:
  split_expense_network:
    driver: bridge
