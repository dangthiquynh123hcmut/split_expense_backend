services:
  postgres:
    image: postgres:15-alpine
    container_name: split_expense_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-split_expense_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - split_expense_network

  redis:
    image: redis:7-alpine
    container_name: split_expense_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - split_expense_network
    volumes:
      - redis_data:/data

  django:
    build: .
    container_name: split_expense_backend
    command: sh -c "cd src && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - split_expense_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:

networks:
  split_expense_network:
    driver: bridge
